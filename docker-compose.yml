version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: stockpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: stockpilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: stockpilot-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@db:5432/stockpilot
      - DATABASE_SYNC_URL=postgresql://postgres:postgrespassword@db:5432/stockpilot
      - JWT_SECRET_KEY=dev-secret-docker-compose-change-in-prod-12345
      - FRONTEND_ORIGIN=http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app/apps/api
      - ./ml:/app/ml
      - ./data_pipeline:/app/data_pipeline

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: stockpilot-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app/apps/web
      - /app/apps/web/node_modules
      - /app/apps/web/.next

volumes:
  postgres_data:
